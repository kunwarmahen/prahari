[project]
name = "prahari"
version = "0.1.0"
description = "prahari -- watches for what you are waiting for, and tells your agent when it happens"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# No dependencies, on purpose: Prahari starts Yantra as a program and reads
# the JSON it prints, so it never imports the framework it watches for.
dependencies = []

[project.scripts]
prahari = "prahari.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prahari"]

[tool.ruff]
line-length = 100          # prose wraps near 79; this is the HARD ceiling
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
